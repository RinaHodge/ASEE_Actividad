name: Generar y Comprimir OpenAPI

on:
  push:
    branches:
      - Ejercicio3

jobs:
  generar-codigo:
    runs-on: ubuntu-latest 

    steps:
      # Paso 1
      - name: Checkout repository
        uses: actions/checkout@v4

      # Paso 2
      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Paso 3
      - name: Generar código del servidor OpenAPI
        run: java -jar openapi-generator-cli.jar generate -i api.yaml -g python-flask -o ./openapi_server --skip-validate-spec

      # Paso 4
      - name: Comprimir directorio openapi_server
        run: |
          zip -r openapi_server.zip openapi_server

      # Paso 5: Subir el archivo comprimido como un artefacto
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: openapi_server.zip
          path: openapi_server.zip